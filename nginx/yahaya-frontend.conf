# Nginx config — hassanskdev.site (Next.js Frontend)
# Path on VPS: /etc/nginx/sites-available/hassanskdev.site

server {
    listen 80;
    listen [::]:80;
    server_name hassanskdev.site www.hassanskdev.site;

    # Redirect HTTP → HTTPS (certbot will add this automatically)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hassanskdev.site www.hassanskdev.site;

    # --- SSL (managed by Certbot / Let's Encrypt) ---
    ssl_certificate     /etc/letsencrypt/live/hassanskdev.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hassanskdev.site/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security headers ---
    add_header X-Frame-Options       "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;

    # --- Proxy to Next.js standalone server on port 3002 ---
    location / {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # --- Next.js static assets (cache aggressively) ---
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002/_next/static/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Public folder ---
    location /public/ {
        proxy_pass http://127.0.0.1:3002/public/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Logging
    access_log /var/log/nginx/yahaya-frontend-access.log;
    error_log  /var/log/nginx/yahaya-frontend-error.log;
}
