# Nginx config — hassanskdev.site (Next.js Frontend)
# Path on VPS: /etc/nginx/sites-available/hassanskdev.site

server {
    listen 80;
    listen [::]:80;
    server_name hassanskdev.site www.hassanskdev.site;

    # --- Proxy to Next.js standalone server on port 3002 ---
    location / {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Logging
    access_log /var/log/nginx/yahaya-frontend-access.log;
    error_log  /var/log/nginx/yahaya-frontend-error.log;
}
