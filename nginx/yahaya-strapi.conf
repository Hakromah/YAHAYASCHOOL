# Nginx config — cms.hassanskdev.site (Strapi CMS)
# Path on VPS: /etc/nginx/sites-available/cms.hassanskdev.site

server {
    listen 80;
    listen [::]:80;
    server_name cms.hassanskdev.site;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cms.hassanskdev.site;

    # --- SSL (managed by Certbot / Let's Encrypt) ---
    ssl_certificate     /etc/letsencrypt/live/cms.hassanskdev.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms.hassanskdev.site/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security headers ---
    add_header X-Frame-Options       "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;

    # --- Upload size (Strapi media uploads) ---
    client_max_body_size 100M;

    # --- Proxy to Strapi on port 1339 ---
    location / {
        proxy_pass         http://127.0.0.1:1339;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Logging
    access_log /var/log/nginx/yahaya-strapi-access.log;
    error_log  /var/log/nginx/yahaya-strapi-error.log;
}
